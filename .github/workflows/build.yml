name: Build VCC for Windows

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release (Win32)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@release/v1
        with:
          arch: x86
          host_arch: x64

      - name: Validate event clock conversion
        shell: pwsh
        run: |
          $testMain = Join-Path $env:RUNNER_TEMP "EventTimingTestMain.cpp"
          $testExe = Join-Path $env:RUNNER_TEMP "EventTimingTests.exe"
          Set-Content -LiteralPath $testMain -Value "int main() { return 0; }" -Encoding ascii

          cl /nologo /std:c++17 /EHsc /D_DEBUG /I. Event.cpp $testMain "/Fe:$testExe"
          if ($LASTEXITCODE -ne 0) {
            throw "Event timing test harness failed to compile."
          }

          & $testExe
          if ($LASTEXITCODE -ne 0) {
            throw "Event timing regression tests failed."
          }

          Write-Host "Event timing regression tests passed."

      - name: Build VCC solution
        shell: cmd
        run: msbuild Vcc.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Verify build output
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "__bin/Win32/Release"
          $exe = Join-Path $output "vcc.exe"

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Build did not produce the expected executable: $exe"
          }

          $dlls = @(Get-ChildItem -LiteralPath $output -Filter "*.dll" -File)
          if ($dlls.Count -eq 0) {
            throw "Build produced vcc.exe but no runtime DLLs were found in $output"
          }

          Write-Host "Executable: $exe"
          Write-Host "Runtime DLL count: $($dlls.Count)"
          Get-ChildItem -LiteralPath $output -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: VCC-EDB-MAIN-Windows-x86
          path: |
            __bin/Win32/Release/*.exe
            __bin/Win32/Release/*.dll
          if-no-files-found: error
          retention-days: 14
